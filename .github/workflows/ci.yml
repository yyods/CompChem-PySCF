name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (service + GUI logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
            - run: "python -m pip install -r requirements-dev.txt jsonschema"
            - run: "python -m pytest tests/test_service.py tests/test_validate.py -q"


  gui-smoke:
    name: Headless GUI smoke + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Qt needs these even with the offscreen platform plugin.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      - run: python -m pip install -r requirements-dev.txt -r requirements-gui.txt

      # does-it-launch: no display server, just the offscreen platform
      - name: GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui_smoke.py -q

      - name: Freeze the client
        run: pyinstaller --noconfirm --clean --name compchem-client --onedir gui/main.py

      - uses: actions/upload-artifact@v7
        with:
          name: compchem-client-linux
          path: dist/compchem-client
          retention-days: 14
